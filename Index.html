<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight Drive | Lofi & Nostalgia Player</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Road Animation -->
  <div class="road-container">
    <div class="night-sky"></div>
    <div class="road"></div>
    <div class="headlight-beam"></div>
  </div>

  <!-- Rain Drops Glass Overlay Canvas -->
  <canvas id="rain-glass-canvas"></canvas>

  <!-- Dashboard Container -->
  <div class="dashboard-container">
    
    <!-- Music Player Card -->
    <div class="now-playing-card">
      
      <div class="header-badge">
        <span class="live-dot"></span> MIDNIGHT AUDIO SYSTEM
      </div>

      <!-- Hidden YouTube Player Container -->
      <div id="youtube-player"></div>

      <!-- Track Info -->
      <div class="track-details">
        <h1 id="track-title">Humko Deewana Kar Gaye</h1>
        <h2 id="track-artist">Sonu Nigam & Tulsi Kumar</h2>
      </div>

      <!-- Glowing Neon Speedometer & Odometer Widget -->
      <div class="speedo-widget">
        <div class="speedo-display">
          <span id="speed-num">65</span>
          <span class="speed-unit">MPH</span>
        </div>
        
        <div class="odometer-display">
          <span class="odo-label">ODO</span>
          <span id="odo-num">004829</span>
          <span class="odo-unit">MI</span>
        </div>

        <div class="drive-modes">
          <button class="mode-btn" onclick="setSpeed(30)">CITY</button>
          <button class="mode-btn active" onclick="setSpeed(65)">CRUISE</button>
          <button class="mode-btn" onclick="setSpeed(90)">HIGHWAY</button>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="player-controls">
        <button id="prev-btn" class="control-btn" title="Previous Track">⏮</button>
        <button id="play-btn" class="control-btn play-main" title="Play / Pause">▶</button>
        <button id="next-btn" class="control-btn" title="Next Track">⏭</button>
      </div>

    </div>

  </div>

  <!-- YouTube Iframe API Script -->
  <script src="https://www.youtube.com/iframe_api"></script>
  
  <!-- Main JavaScript File -->
  <script src="script.js"></script>

</body>
</html>
